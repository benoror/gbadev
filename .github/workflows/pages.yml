name: Deploy GitHub Pages

# Publishes /public to https://benoror.github.io/gbadev
# Triggers on every push to the default branch (master) or preserve,
# plus manual dispatch from the Actions tab.
#
# IMPORTANT: For this to actually deploy, repo Settings → Pages → Source
# must be set to "GitHub Actions" (not "Deploy from a branch").

on:
  push:
    branches: [master, main, preserve]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid stacked deployments — the latest push always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
