name: Deploy GitHub Pages

# Publishes /public to https://benoror.github.io/gbadev on every push
# to master or preserve, and on manual dispatch from the Actions tab.

on:
  push:
    branches: [master, preserve]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Required permissions for the Pages deployment APIs.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-flight deployment if a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
