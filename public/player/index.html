<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Player</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  <!--
    coi-serviceworker injects COOP/COEP headers so threaded WASM runs on any static host.
    Loaded from the repo root (scope=/) so both the showcase (/) and the player (/player/)
    end up cross-origin isolated — iframes inherit the parent's isolation state, so both
    documents need the SW active.
  -->
  <script src="../coi-sw.js"></script>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>
  <main class="app">
    <div class="screen-wrap">
      <canvas id="screen" width="240" height="160" aria-label="Emulator display"></canvas>
      <div id="status" class="status" role="status" aria-live="polite">Booting mGBA…</div>
    </div>

    <!--
      Gameplay controls (pause / reset / save-state / screenshot / volume) have been lifted to
      the museum shell, which drives the iframe through `window.playerAPI` in app.js. When
      the player is opened standalone (via the "Open in new window" button below or a direct
      URL) the keyboard bindings in app.js still work — only the on-screen toolbar is gone.
    -->
    <section class="touch" aria-label="Touch controls" aria-hidden="true">
      <div class="tpad dpad">
        <button class="dbtn up" data-btn="Up" aria-label="Up">▲</button>
        <button class="dbtn left" data-btn="Left" aria-label="Left">◀</button>
        <button class="dbtn right" data-btn="Right" aria-label="Right">▶</button>
        <button class="dbtn down" data-btn="Down" aria-label="Down">▼</button>
      </div>
      <div class="tpad ab">
        <button class="abtn" data-btn="B" aria-label="B">B</button>
        <button class="abtn" data-btn="A" aria-label="A">A</button>
      </div>
      <div class="tpad lr">
        <button class="lrbtn" data-btn="L" aria-label="L">L</button>
        <button class="lrbtn" data-btn="R" aria-label="R">R</button>
      </div>
      <div class="tpad ss">
        <button class="ssbtn" data-btn="Select" aria-label="Select">Select</button>
        <button class="ssbtn" data-btn="Start" aria-label="Start">Start</button>
      </div>
    </section>

    <div class="pop">
      <button id="btn-pop" type="button" title="Open this ROM in a standalone browser window">
        Open in new window
      </button>
    </div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
