<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GBA Dev Museum</title>
  <!--
    coi-serviceworker installs a SW at / that injects COOP/COEP headers so threaded mGBA can use
    SharedArrayBuffer. Iframes inherit the parent's isolation state, so both this page and
    /player/ need the SW active.
  -->
  <script src="./coi-sw.js"></script>
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
  <link rel="stylesheet" href="./museum.css" />
</head>
<body>
  <main class="museum">
    <header class="museum-header">
      <p>preserved · reconstructed · reimagined</p>
      <h1>GBA Dev Museum</h1>
      <div class="legend" aria-label="Legend">
        <span class="chip"><span class="dot historical"></span>Historical</span>
        <span class="chip"><span class="dot latest"></span>Canonical shipped</span>
        <span class="chip"><span class="dot faithful"></span>Faithful rebuild</span>
        <span class="chip"><span class="dot modern"></span>Modern rebuild</span>
      </div>
    </header>

    <section aria-label="Game cartridges">
      <div id="rack" class="rack" role="tablist"></div>
    </section>

    <section class="stage">
      <div class="stage-player-col">
        <div id="player-wrap" class="stage-player" data-crt="false" aria-label="Game Boy Advance">
          <div class="screen">
            <!-- mGBA writes pixels straight to this canvas; no iframe involved. ROM swaps
                 are hot (Module.quitGame() + loadGame()) so the WASM never re-inits. -->
            <canvas id="player-canvas" width="240" height="160" aria-label="Emulator display"></canvas>
            <div id="player-status" class="player-status hidden" role="status" aria-live="polite"></div>
          </div>
        </div>
        <p class="stage-hints" aria-hidden="true">
          Keyboard: Arrows · <span class="kbd">Z</span>=B · <span class="kbd">X</span>=A ·
          <span class="kbd">A</span>=L · <span class="kbd">S</span>=R ·
          <span class="kbd">Enter</span>=Start · <span class="kbd">Backspace</span>=Select ·
          hold <span class="kbd">Tab</span> = fast-forward
        </p>
        <div class="stage-controls">
          <!-- LED dots mimic the GBA power indicator: green while the option is on, dark off. -->
          <button id="btn-pause" type="button"><span class="led" aria-hidden="true"></span><span class="label">Pause</span></button>
          <button id="btn-reset" type="button"><span class="led" aria-hidden="true"></span>Reset</button>
          <button id="btn-shot"  type="button"><span class="led" aria-hidden="true"></span>Screenshot</button>
          <label class="slot">
            Slot
            <select id="state-slot" aria-label="Save state slot">
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
              <option>7</option><option>8</option><option>9</option>
            </select>
          </label>
          <button id="btn-save" type="button"><span class="led" aria-hidden="true"></span>Save State</button>
          <button id="btn-load" type="button"><span class="led" aria-hidden="true"></span>Load State</button>
          <label class="volume">
            Volume
            <input id="volume" type="range" min="0" max="100" value="70" aria-label="Volume" />
          </label>
          <button id="btn-fullscreen" type="button"><span class="led" aria-hidden="true"></span>Fullscreen</button>
          <button id="btn-crt" type="button"><span class="led" aria-hidden="true"></span>CRT shader</button>
          <button id="btn-info" type="button" class="is-on"><span class="led" aria-hidden="true"></span>Notes</button>
        </div>
      </div>
    </section>

    <section id="spine-wrap" class="spine-wrap" aria-label="Version timeline" style="display:none">
      <div class="spine-header">
        <div>
          <strong id="spine-title">—</strong>
          <span style="margin-left: 8px" id="spine-count"></span>
        </div>
        <div>
          <span class="kbd">←</span> <span class="kbd">→</span> walk versions · <span class="kbd">F</span> fullscreen · <span class="kbd">C</span> CRT · <span class="kbd">I</span> notes
        </div>
      </div>
      <div id="spine" class="spine" role="tablist"></div>
    </section>

    <aside id="notes" class="stage-notes" aria-label="Version notes">
      <span id="notes-eyebrow" class="eyebrow">Select a version</span>
      <h2 id="notes-title">—</h2>
      <div id="notes-meta" class="meta"></div>
      <p id="notes-summary"></p>
      <div id="notes-links" class="links"></div>
    </aside>

    <p id="fatal" style="display:none;color:#ff7070;font-weight:600"></p>
  </main>

  <script type="module" src="./museum.js"></script>
</body>
</html>
